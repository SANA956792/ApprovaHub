<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - IBAT OP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #070e1a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 400px;
        background: #0d1627;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 32px 24px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        object-fit: cover;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #10b981;
        color: #04130d;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/aistudio/Ibat_Logo__2___1__de631039.png" alt="IBAT OP Logo" />
      <h1>You are currently offline</h1>
      <p>Please check your internet connection to sync the latest approval requests, attachments, and group messages.</p>
      <button onclick="window.location.reload()">Try Reconnecting</button>
    </div>
  </body>
</html>
